
name: Build Nova Store APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Check ZIP
        run: |
          echo "Checking Nova Store ZIP..."
          ls -lah
          test -f nova_store_v2.zip

      - name: Extract ZIP
        run: |
          mkdir -p work
          unzip -o nova_store_v2.zip -d work
          echo "ZIP extracted successfully"
          find work -maxdepth 5 -type f | head -100

      - name: Find Android project
        run: |
          PROJ=$(find work -type f \( \
            -name settings.gradle \
            -o -name settings.gradle.kts \
          \) -print -quit | xargs -r dirname)

          if [ -z "$PROJ" ]; then
            echo "ERROR: Android Gradle project not found!"
            exit 1
          fi

          echo "PROJ=$PROJ" >> $GITHUB_ENV
          echo "Found project: $PROJ"

      - name: Accept Android licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Build Nova Store
        run: |
          gradle assembleDebug --no-daemon -p "$PROJ"

      - name: Upload Nova Store APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaStore-debug-apk
          path: work/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
