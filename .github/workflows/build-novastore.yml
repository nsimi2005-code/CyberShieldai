
name: Build Nova Store APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Unzip Nova Store project
        run: |
          mkdir work
          unzip -q nova_store_v2.zip -d work
          PROJ=$(dirname "$(find work -type f \( -name settings.gradle.kts -o -name settings.gradle \) | head -1)")
          echo "PROJ=$PROJ" >> $GITHUB_ENV

      - name: Build APK
        run: gradle assembleDebug --no-daemon -p "$PROJ"

      - uses: actions/upload-artifact@v4
        with:
          name: NovaStore-debug-apk
          path: work/**/build/outputs/apk/debug/*.apk
