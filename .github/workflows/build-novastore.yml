
name: Build Nova Store APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Check ZIP
        run: |
          echo "Checking Nova Store ZIP..."
          ls -lah
          test -f novastore_v2.zip

      - name: Extract ZIP
        run: |
          mkdir -p work
          unzip -o novastore_v2.zip -d work
          echo "Extraction completed"

      - name: Find Android project
        run: |
          PROJ=$(find work -type f \( \
            -name settings.gradle \
            -o -name settings.gradle.kts \
          \) -print -quit | xargs -r dirname)

          if [ -z "$PROJ" ]; then
            echo "Android Gradle project not found!"
            echo "Checking extracted files:"
            find work -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "PROJ=$PROJ" >> "$GITHUB_ENV"
          echo "Project found: $PROJ"

      - name: Accept Android licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Build APK
        run: |
          gradle assembleDebug --no-daemon -p "$PROJ"

      - name: Upload Nova Store APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaStore-debug-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
