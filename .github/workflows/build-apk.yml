name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Unzip project
        run: |
          mkdir work
          unzip -q CyberShieldAI.zip -d work
          echo "PROJ=$(dirname $(find work -name settings.gradle.kts | head -1))" >> $GITHUB_ENV
      - run: gradle assembleDebug --no-daemon -p "$PROJ"
      - uses: actions/upload-artifact@v4
        with:
          name: CyberShieldAI-debug-apk
          path: work/**/app/build/outputs/apk/debug/app-debug.apk
